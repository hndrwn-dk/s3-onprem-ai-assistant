x-app-environment: &app-environment
  MODEL: ${MODEL:-phi3:mini}
  LLM_PROVIDER: ${LLM_PROVIDER:-ollama}
  API_KEY: ${API_KEY:-}
  CORS_ORIGINS: ${CORS_ORIGINS:-*}
  VECTOR_SEARCH_K: ${VECTOR_SEARCH_K:-3}
  CACHE_TTL_HOURS: ${CACHE_TTL_HOURS:-24}
  ALLOW_DANGEROUS_DESERIALIZATION: ${ALLOW_DANGEROUS_DESERIALIZATION:-true}
  OLLAMA_HOST: http://ollama:11434
  QUICK_SEARCH_MAX_RESULTS: ${QUICK_SEARCH_MAX_RESULTS:-10}
  QUICK_SEARCH_ENABLE_KEYWORD_FALLBACK: ${QUICK_SEARCH_ENABLE_KEYWORD_FALLBACK:-true}
  EMBED_DEVICE: ${EMBED_DEVICE:-cpu}
  EMBED_BATCH_SIZE: ${EMBED_BATCH_SIZE:-64}
  SEARCH_MODE: ${SEARCH_MODE:-auto}
  OPENAI_API_KEY: ${OPENAI_API_KEY:-}
  OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
  OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
  AZURE_OPENAI_API_KEY: ${AZURE_OPENAI_API_KEY:-}
  AZURE_OPENAI_ENDPOINT: ${AZURE_OPENAI_ENDPOINT:-}
  AZURE_OPENAI_DEPLOYMENT: ${AZURE_OPENAI_DEPLOYMENT:-}
  AZURE_OPENAI_API_VERSION: ${AZURE_OPENAI_API_VERSION:-2024-02-15-preview}
  ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
  ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-3-5-haiku-20241022}
  GROQ_API_KEY: ${GROQ_API_KEY:-}
  GROQ_MODEL: ${GROQ_MODEL:-llama-3.1-8b-instant}
  OPENAI_COMPAT_API_KEY: ${OPENAI_COMPAT_API_KEY:-}
  OPENAI_COMPAT_BASE_URL: ${OPENAI_COMPAT_BASE_URL:-}
  OPENAI_COMPAT_MODEL: ${OPENAI_COMPAT_MODEL:-}

services:
  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama:/root/.ollama
      - hf_cache:/root/.cache/huggingface
    environment:
      - OLLAMA_HOST=0.0.0.0

  api:
    build: .
    restart: unless-stopped
    environment:
      <<: *app-environment
    ports:
      - "8000:8000"
    volumes:
      - ./cache:/app/cache
      - ./s3_all_docs:/app/s3_all_docs
      - ./docs:/app/docs
      - hf_cache:/root/.cache/huggingface
    depends_on:
      - ollama

  streamlit:
    build: .
    command: streamlit run streamlit_ui.py --server.address 0.0.0.0 --server.port 8501
    restart: unless-stopped
    environment:
      <<: *app-environment
    ports:
      - "8501:8501"
    volumes:
      - ./s3_all_docs:/app/s3_all_docs
      - ./docs:/app/docs
      - ./cache:/app/cache
      - hf_cache:/root/.cache/huggingface
    depends_on:
      - ollama
      - api

  cli:
    build: .
    entrypoint: ["python", "s3ai_query.py"]
    environment:
      <<: *app-environment
    volumes:
      - ./s3_all_docs:/app/s3_all_docs
      - ./docs:/app/docs
      - ./cache:/app/cache
    depends_on:
      - ollama

volumes:
  ollama:
    driver: local
  hf_cache:
    driver: local
